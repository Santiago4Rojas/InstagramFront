<ion-content [fullscreen]="true">
  <div class="register-wrap">

    <!-- Logo -->
    <div class="logo-area">
      <span class="brand-font">Instagram</span>
    </div>

    <!-- Headline -->
    <div class="headline-area">
      <p class="headline">Sign up to see photos and videos from your friends.</p>
    </div>

    <!-- Fields -->
    <div class="form-area">

      <div class="input-wrap">
        <input
          class="light-input"
          type="text"
          placeholder="Mobile number or email"
          [(ngModel)]="mobile"
          autocomplete="email"
          autocapitalize="none"
          autocorrect="off"
        />
      </div>

      <div class="input-wrap">
        <input
          class="light-input"
          type="text"
          placeholder="Full name"
          [(ngModel)]="name"
          autocomplete="name"
        />
      </div>

      <div class="input-wrap">
        <input
          class="light-input"
          type="text"
          placeholder="Username"
          [(ngModel)]="username"
          autocapitalize="none"
          autocorrect="off"
        />
      </div>

      <div class="input-wrap password-wrap">
        <input
          class="light-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          [(ngModel)]="password"
        />
        <button class="show-hide-btn" type="button" (click)="showPassword = !showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button
        class="submit-btn"
        [class.submit-btn--disabled]="!canSubmit"
        [disabled]="!canSubmit"
        (click)="submit()"
      >
        @if (loading) {
          <span class="spinner"></span>
        } @else {
          Sign up
        }
      </button>

      <p class="terms">
        By signing up, you agree to our <span class="terms-link">Terms</span>,
        <span class="terms-link">Privacy Policy</span> and
        <span class="terms-link">Cookies Policy</span>.
      </p>

    </div>

    <!-- Spacer -->
    <div class="spacer"></div>

    <!-- Log in section -->
    <div class="login-section">
      <div class="login-divider"></div>
      <p class="login-row">
        Have an account?
        <span class="login-link" (click)="goLogin()">Log in</span>
      </p>
      <div class="meta-logo">
        <span class="meta-from">from</span>
        <span class="meta-brand">Meta</span>
      </div>
    </div>

  </div>
</ion-content>
