<ion-content [fullscreen]="true">
  <div class="register-wrap">

    <!-- Logo — mismo que login, padding-top menor por los 4 campos -->
    <div class="logo-area">
      <span class="brand-font">Instagram</span>
    </div>

    <!-- Campos en el orden solicitado -->
    <div class="form-area">

      <div class="input-wrap">
        <input
          class="field-input"
          type="text"
          placeholder="Nombre completo"
          [(ngModel)]="name"
          autocomplete="name"
        />
      </div>

      <div class="input-wrap">
        <input
          class="field-input"
          type="text"
          placeholder="Usuario"
          [(ngModel)]="username"
          autocapitalize="none"
          autocorrect="off"
        />
      </div>

      <div class="input-wrap">
        <input
          class="field-input"
          type="text"
          placeholder="Correo electrónico o número de teléfono"
          [(ngModel)]="mobile"
          autocomplete="email"
          autocapitalize="none"
          autocorrect="off"
        />
      </div>

      <div class="input-wrap password-wrap">
        <input
          class="field-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Contraseña"
          [(ngModel)]="password"
        />
        <button class="show-hide-btn" type="button" (click)="showPassword = !showPassword">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" class="eye-icon"></ion-icon>
        </button>
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button
        class="submit-btn"
        [class.submit-btn--disabled]="!canSubmit"
        [disabled]="!canSubmit"
        (click)="submit()"
      >
        @if (loading) {
          <span class="spinner"></span>
        } @else {
          Crear cuenta
        }
      </button>

    </div>

    <!-- Empuja el footer al fondo -->
    <div class="spacer"></div>

    <!-- Footer -->
    <div class="footer-section">
      <div class="footer-divider"></div>
      <p class="footer-row">
        ¿Ya tienes una cuenta?
        <span class="footer-link" (click)="goLogin()">Inicia sesión</span>
      </p>
      <div class="meta-logo">
        <span class="meta-from">from</span>
        <span class="meta-brand">Meta</span>
      </div>
    </div>

  </div>
</ion-content>
