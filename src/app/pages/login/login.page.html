<ion-content [fullscreen]="true">
  <div class="login-wrap">

    <!-- Logo -->
    <div class="logo-area">
      <span class="brand-font">Instagram</span>
    </div>

    <!-- Fields -->
    <div class="form-area">

      <div class="input-wrap">
        <input
          class="light-input"
          type="text"
          placeholder="Phone number, username or email"
          [(ngModel)]="email"
          autocomplete="email"
          autocapitalize="none"
          autocorrect="off"
        />
      </div>

      <div class="input-wrap password-wrap">
        <input
          class="light-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          [(ngModel)]="password"
        />
        <button class="show-hide-btn" type="button" (click)="showPassword = !showPassword">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" class="eye-icon"></ion-icon>
        </button>
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button
        class="submit-btn"
        [class.submit-btn--disabled]="!canSubmit"
        [disabled]="!canSubmit"
        (click)="submit()"
      >
        @if (loading) {
          <span class="spinner"></span>
        } @else {
          Log in
        }
      </button>

      <div class="forgot-wrap">
        <span class="forgot-link">Forgot password?</span>
      </div>

    </div>

    <!-- OR divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">OR</span>
      <span class="divider-line"></span>
    </div>

    <!-- Push footer down -->
    <div class="spacer"></div>

    <!-- Create account + Meta -->
    <div class="create-section">
      <div class="create-divider"></div>
      <button class="create-btn" (click)="goRegister()">Create new account</button>
      <div class="meta-logo">
        <span class="meta-from">from</span>
        <span class="meta-brand">Meta</span>
      </div>
    </div>

  </div>
</ion-content>
