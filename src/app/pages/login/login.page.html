<ion-content>
  <div class="login-wrap">

    <!-- Logo -->
    <div class="logo-area">
      <span class="brand-font">Instagram</span>
    </div>

    <!-- Toggle tabs -->
    <div class="tab-toggle">
      <button class="tab-btn" [class.active]="!isRegister" (click)="mode='login'">Iniciar sesión</button>
      <button class="tab-btn" [class.active]="isRegister"  (click)="mode='register'">Crear cuenta</button>
    </div>

    <!-- Form -->
    <div class="form-area">

      @if (isRegister) {
        <div class="input-wrap">
          <input class="dark-input" type="text" placeholder="Nombre completo" [(ngModel)]="name" />
        </div>
        <div class="input-wrap">
          <input class="dark-input" type="text" placeholder="Usuario" [(ngModel)]="username" autocapitalize="none" />
        </div>
      }

      <div class="input-wrap">
        <input class="dark-input" type="email" placeholder="Correo electrónico" [(ngModel)]="email" autocomplete="email" />
      </div>

      <div class="input-wrap">
        <input class="dark-input" type="password" placeholder="Contraseña" [(ngModel)]="password" />
      </div>

      @if (!isRegister) {
        <div class="forgot-wrap">
          <span class="forgot-link">¿Olvidaste tu contraseña?</span>
        </div>
      }

      <button class="submit-btn" (click)="submit()">
        {{ isRegister ? 'Crear cuenta' : 'Entrar' }}
      </button>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

    </div>

    <!-- Divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">O</span>
      <span class="divider-line"></span>
    </div>

    <!-- Footer link -->
    <div class="footer-link">
      @if (isRegister) {
        <span class="text-secondary">¿Ya tienes una cuenta?</span>
        <span class="text-action" (click)="mode='login'">&nbsp;Inicia sesión</span>
      } @else {
        <span class="text-secondary">¿No tienes una cuenta?</span>
        <span class="text-action" (click)="mode='register'">&nbsp;Regístrate</span>
      }
    </div>

  </div>
</ion-content>
